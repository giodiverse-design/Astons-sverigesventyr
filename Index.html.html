<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Astons Sverigeäventyr</title><style>
:root{--blue:#164e76;--sky:#e6f4fa;--paper:#f7faf9;--accent:#efae43;--ink:#173446;--green:#2f805c}*{box-sizing:border-box}body{margin:0;font:17px/1.55 system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--paper);color:var(--ink)}header{background:linear-gradient(110deg,#135078,#277e93);color:white;padding:28px max(22px,calc((100vw - 1080px)/2))}h1{margin:0;font-size:clamp(28px,4vw,42px)}header p{margin:6px 0 0}nav{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 15px;background:#dbeef2;color:#183d52}button:hover{filter:brightness(.96)}button:focus-visible,input:focus-visible{outline:3px solid #ecad32;outline-offset:2px}.nav{background:#ffffff24;color:#fff;border:1px solid #ffffff66}.nav.active{background:#fff;color:#174e73}.primary{background:#176b85;color:white}.small{padding:6px 10px;font-size:14px}main{max-width:1080px;margin:25px auto;padding:0 18px 70px}.hero,.panel,.topic{background:white;border:1px solid #dce7e9;border-radius:20px;box-shadow:0 3px 12px #163d4b0a;padding:22px}.hero{background:linear-gradient(120deg,#fff,#e6f5ec)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:15px}.topic{display:flex;flex-direction:column;gap:10px}.topic h3{margin:0}.topic p{flex:1;margin:0;color:#4a6270}.tag{display:inline-block;background:#edf1f3;padding:3px 10px;border-radius:20px;font-size:13px}.done{background:#d9f4e5}.doing{background:#fff1cc}.again{background:#ffe1df}.bar{height:15px;border-radius:10px;background:#dfecef;overflow:hidden}.fill{height:100%;background:#2d8b73;transition:width .2s}.muted{color:#557080}.hidden{display:none!important}.question{background:#f2f8fa;padding:17px;border-radius:15px;margin:14px 0}.options{display:grid;gap:8px;margin:12px 0}.options button{text-align:left;background:#eaf3f5;border:2px solid transparent}.options button.chosen{border-color:#216c8c}.feedback{padding:12px;border-left:4px solid #2d8b73;background:#edf8f2;margin:12px 0;border-radius:7px}.hint{padding:12px;border-left:4px solid #ecad32;background:#fff7e6;margin:12px 0;border-radius:7px}section{margin:18px 0}.landscape{max-width:540px;width:100%;margin:auto;display:block;background:#e7f3f8;border:1px solid #badce8;border-radius:18px}.mapspot{fill:#f5bc5b;stroke:#9c5b18;stroke-width:1.8;cursor:pointer}.mapspot:hover,.mapspot:focus{fill:#ffdf81;stroke:#124b70;stroke-width:3}.maplabel{font-size:12px;fill:#12435c}.mapwater{fill:#80b9d2}.stats{font-size:32px;font-weight:800;color:#15617b}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.notice{background:#fff8e8;border:1px solid #edd99b;padding:12px;border-radius:12px}footer{text-align:center;padding:20px;font-size:13px;color:#607783}@media(max-width:650px){header{padding:24px 18px}.panel,.hero{padding:17px}.maplabel{font-size:13px}}
</style></head><body><header><h1>🧭 Astons Sverigeäventyr</h1><p>Upptäck Sverige, ett litet steg i taget! För årskurs 5.</p><nav><button class="nav active" data-view="home">🏠 Start</button><button class="nav" data-view="learn">📚 Lektioner</button><button class="nav" data-view="map">🗺️ Kartverkstad</button><button class="nav" data-view="repeat">🔁 Repetition</button><button class="nav" data-view="adult">👨‍🏫 Morfars översikt</button></nav></header><main><div id="content"></div></main><footer>Allt träningsarbete sparas lokalt i den här webbläsaren. Ingen inloggning krävs.</footer><script>
const topics=[
{id:'landskap',emoji:'🏞️',name:'Sveriges landskap',intro:'Sverige har 25 landskap. Landskap är historiska områden – inte samma sak som län.',facts:['Göteborg ligger i landskapet Västergötland, nära Bohuslän och Halland.','Skåne är Sveriges sydligaste landskap.','Lappland ligger långt norrut och är Sveriges största landskap till ytan.'],questions:[['Vilket landskap ligger längst söderut?',['Skåne','Dalarna','Uppland'],0,'Tänk på Sveriges allra sydligaste del.'],['Hur många landskap har Sverige?',['21','25','29'],1,'Det är fler än 20 men färre än 30.']]},
{id:'stader',emoji:'🏙️',name:'Städer och väderstreck',intro:'Vi lär oss var några av Sveriges städer ligger och tränar att använda väderstreck.',facts:['Stockholm ligger i östra Sverige vid Östersjön och är Sveriges huvudstad.','Göteborg ligger på västkusten vid Kattegatt.','Malmö ligger i Skåne i södra Sverige.'],questions:[['Vilken stad är Sveriges huvudstad?',['Göteborg','Stockholm','Uppsala'],1,'Där finns riksdagen och regeringen.'],['Vilken stad ligger på västkusten?',['Göteborg','Stockholm','Visby'],0,'Tänk på hamnen vid Göta älvs mynning.']]},
{id:'sjoar',emoji:'💧',name:'Sjöar och vatten',intro:'Sjöar innehåller stillastående vatten. Sverige har mängder av sjöar.',facts:['Vänern är Sveriges största sjö till ytan.','Vättern är Sveriges näst största sjö till ytan.','Mälaren ligger väster om Stockholm och har förbindelse med Östersjön.'],questions:[['Vilken sjö är störst i Sverige?',['Mälaren','Vättern','Vänern'],2,'Namnet börjar med Vä- och slutar på -nern.'],['Vilken sjö ligger nära Stockholm?',['Mälaren','Siljan','Hornavan'],0,'Sök efter sjön direkt väster om huvudstaden.']]},
{id:'alvar',emoji:'🌊',name:'Älvar och vattnets väg',intro:'En älv är ett stort vattendrag. Vattnet rinner från högre mark mot lägre mark.',facts:['Göta älv rinner från Vänern mot havet vid Göteborg.','Torne älv rinner i nordöstra Sverige och längs en del av gränsen mot Finland.','Många stora älvar i norra Sverige används för vattenkraft.'],questions:[['Vilken älv rinner från Vänern mot Göteborg?',['Göta älv','Torne älv','Dalälven'],0,'Den delar nästan namn med staden Göteborg.'],['Vad kan vatten i en älv användas till?',['Vattenkraft','Skapa öken','Stoppa moln'],0,'Rinnande vatten kan sätta turbiner i rörelse.']]},
{id:'berg',emoji:'⛰️',name:'Berg och fjäll',intro:'I västra och norra Sverige finns höga fjäll. Vi tränar på höjd och natur.',facts:['Kebnekaise är Sveriges högsta berg; vilken av dess toppar som är högst kan förändras när isen smälter.','Den svenska fjällkedjan löper nära gränsen mot Norge.','Trädgränsen är den höjd där träd inte längre växer som skog.'],questions:[['Vad heter Sveriges högsta berg?',['Åreskutan','Kebnekaise','Kinnekulle'],1,'Det ligger i Lappland.'],['Var finns den svenska fjällkedjan främst?',['Vid gränsen mot Norge','Bara på Gotland','Mitt i Skåne'],0,'Titta mot väster på Sverigekartan.']]},
{id:'klimat',emoji:'🌦️',name:'Väder och klimat',intro:'Väder berättar hur det är ute just nu. Klimat beskriver typiska väderförhållanden under lång tid.',facts:['Norra Sverige har generellt kallare vintrar än södra Sverige.','Havet kan göra att kustområden får jämnare temperatur.','Väder kan ändras från dag till dag, medan klimat mäts över många år.'],questions:[['Vad beskriver klimat?',['Vädret klockan 12','Typiskt väder under många år','Bara nästa dags regn'],1,'Tänk lång tid, inte bara idag.'],['Var är vintern oftast kallare?',['Norra Sverige','Södra Skåne','Det är alltid lika'],0,'Fundera på hur långt norrut platsen ligger.']]},
{id:'natur',emoji:'🌲',name:'Natur och naturtyper',intro:'Upptäck skogar, fjäll, kuster och varför naturen är värd att ta hand om.',facts:['Barrskog är vanlig i stora delar av Sverige och består bland annat av gran och tall.','På fjället finns öppna marker ovanför trädgränsen.','Allemansrätten låter oss vistas i naturen med ansvar att inte störa eller förstöra.'],questions:[['Vilka träd finns i barrskog?',['Gran och tall','Palmer och bananträd','Enbart björk'],0,'De har barr i stället för breda löv.'],['Vad betyder allemansrätten i korthet?',['Gå varsamt i naturen','Slänga skräp var som helst','Bryta grenar från alla träd'],0,'Inte störa – inte förstöra.']]}
];
const key='aston-sverigetraning-v1';let data;try{data=JSON.parse(localStorage.getItem(key))||{}}catch(e){data={}};if(!data.topics)data.topics={};let view='home',activeTopic=topics[0].id,qi=0,chosen=null,tries=0,hintShown=false,mapStep=0,mapSolved={},feedback='';const $=s=>document.querySelector(s),save=()=>{try{localStorage.setItem(key,JSON.stringify(data))}catch(e){console.warn('Lokal lagring är inte tillgänglig i denna visning.')}};function td(id){return data.topics[id]||{status:'new',attempts:0,correct:0,visits:0}}function settd(id,values){data.topics[id]={...td(id),...values};save()}function status(id){let s=td(id).status;return s==='done'?'✅ Klar':s==='doing'?'🟡 Pågår':s==='again'?'🔁 Behöver träna':'⚪ Inte börjat'}function badge(id){return '<span class="tag '+td(id).status+'">'+status(id)+'</span>'}function progress(){return Math.round(100*topics.filter(t=>td(t.id).status==='done').length/topics.length)}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function home(){return `<div class="hero"><h2>Hej Aston! 👋</h2><p>Här får du upptäcka Sveriges landskap, städer, sjöar, älvar, berg, klimat och natur. Du behöver inte kunna allt direkt – det viktiga är att fundera och försöka.</p><div class="row"><button class="primary" onclick="go('learn')">Välj dagens lektion</button><button onclick="go('map')">Öppna kartverkstaden</button></div></div><section class="panel"><h2>Din upptäcktsresa</h2><div class="bar" aria-label="${progress()} procent klart"><div class="fill" style="width:${progress()}%"></div></div><p><b>${topics.filter(t=>td(t.id).status==='done').length} av ${topics.length}</b> områden klara • ${progress()} %</p><p class="muted">Tips: Träna gärna 10–15 minuter åt gången. Små steg räcker långt!</p></section><section><h2>Vad vill du utforska?</h2><div class="grid">${topics.map(t=>`<div class="topic"><h3>${t.emoji} ${t.name}</h3>${badge(t.id)}<p>${t.intro}</p><button onclick="start('${t.id}')">Öppna lektion</button></div>`).join('')}</div></section>`}
function learn(){return `<h2>📚 Välj din lektion</h2><p>Varje tema har tre korta fakta, två frågor och ledtrådar.</p><div class="grid">${topics.map(t=>`<div class="topic"><h3>${t.emoji} ${t.name}</h3>${badge(t.id)}<p>${t.intro}</p><button class="primary" onclick="start('${t.id}')">Träna här</button></div>`).join('')}</div>`}
function lesson(){const t=topics.find(t=>t.id===activeTopic),q=t.questions[qi];return `<button onclick="go('learn')">← Alla lektioner</button><section class="panel"><h2>${t.emoji} ${t.name}</h2>${badge(t.id)}<p>${t.intro}</p><h3>Tre saker att upptäcka</h3><ol>${t.facts.map(f=>`<li>${f}</li>`).join('')}</ol><hr><p class="muted">Fråga ${qi+1} av ${t.questions.length}</p><div class="question"><h3>${esc(q[0])}</h3><div class="options">${q[1].map((o,i)=>`<button class="${chosen===i?'chosen':''}" onclick="choose(${i})" ${feedback.startsWith('Rätt')?'disabled':''}>${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}</div><div class="row"><button onclick="showHint()">💡 Ge mig en ledtråd</button><button class="primary" onclick="check()">Kontrollera mitt svar</button></div>${hintShown?`<div class="hint">${esc(q[3])}</div>`:''}${feedback?`<div class="${feedback.startsWith('Rätt')?'feedback':'hint'}">${esc(feedback)}</div>`:''}${feedback.startsWith('Rätt')?`<button class="primary" onclick="nextQuestion()">${qi===t.questions.length-1?'Avsluta lektion':'Nästa fråga →'}</button>`:''}</div></section>`}
function start(id){activeTopic=id;qi=0;chosen=null;tries=0;hintShown=false;feedback='';settd(id,{status:td(id).status==='done'?'done':'doing',visits:td(id).visits+1});view='lesson';render()}function choose(i){chosen=i;feedback='';render()}function showHint(){hintShown=true;render()}function check(){const t=topics.find(t=>t.id===activeTopic);if(chosen===null){feedback='Välj ett alternativ först. Du kan också be om en ledtråd.';render();return}let right=chosen===t.questions[qi][2];tries++;settd(activeTopic,{attempts:td(activeTopic).attempts+1,correct:td(activeTopic).correct+(right?1:0)});feedback=right?'Rätt! Bra tänkt. Kan du förklara varför svaret stämmer?':'Inte riktigt än. Läs ledtråden och försök igen. Du lär dig när du provar!';if(!right)hintShown=true;render()}function nextQuestion(){let t=topics.find(t=>t.id===activeTopic);if(qi<t.questions.length-1){qi++;chosen=null;tries=0;hintShown=false;feedback='';render();return}settd(activeTopic,{status:td(activeTopic).correct>=t.questions.length&&td(activeTopic).attempts<=t.questions.length*2?'done':'again',last:new Date().toLocaleDateString('sv-SE')});view='finished';render()}
function finished(){return `<div class="hero"><h2>🌟 Bra jobbat, Aston!</h2><p>Du har tränat på ${topics.find(t=>t.id===activeTopic).name.toLowerCase()}.</p>${badge(activeTopic)}<p>Vill du göra om lektionen, prova en karta eller ta en liten paus?</p><div class="row"><button onclick="start('${activeTopic}')">Träna igen</button><button class="primary" onclick="go('map')">Kartverkstad</button><button onclick="go('home')">Till start</button></div></div>`}
const spots=[{name:'Göteborg',x:133,y:440,hint:'På västkusten, söder om Vänern.'},{name:'Stockholm',x:229,y:361,hint:'På östkusten, vid Mälaren.'},{name:'Malmö',x:168,y:523,hint:'Längst söderut, i Skåne.'},{name:'Vänern',x:177,y:424,hint:'Stor sjö mellan Värmland, Dalsland och Västergötland.'},{name:'Vättern',x:200,y:451,hint:'Smal och lång sjö öster om Vänern.'},{name:'Kebnekaise',x:149,y:122,hint:'Långt i norr, nära norska gränsen.'}];
function map(){let s=spots[mapStep];return `<h2>🗺️ Kartverkstad</h2><p>Tryck på den gula punkten där du tror platsen finns. Du får ledtrådar och kan försöka flera gånger.</p><div class="grid" style="grid-template-columns:minmax(240px,1fr) minmax(260px,1fr)"><div class="panel"><svg class="landscape" viewBox="0 0 350 570" role="img" aria-label="Förenklad översiktskarta över Sveriges form och övningspunkter"><rect width="350" height="570" fill="#e7f3f8"/><path d="M164 15 L183 27 205 51 199 76 218 107 208 134 222 164 210 201 235 226 224 267 240 305 258 331 252 365 264 401 254 429 235 451 227 473 211 493 199 514 174 536 152 532 133 511 139 482 122 458 125 428 110 405 123 381 118 352 106 320 117 295 122 264 121 229 126 199 133 171 129 145 140 122 130 96 147 73 138 43 Z" fill="#b1d4ad" stroke="#4d8d6e" stroke-width="2"/><path d="M161 414 Q174 407 188 415 L190 437 174 444 160 432Z" class="mapwater"/><path d="M201 428 Q204 435 199 456 L195 467 191 451Z" class="mapwater"/><text x="22" y="55" font-size="15" fill="#527b95">NORGE</text><text x="252" y="170" font-size="14" fill="#527b95">FINLAND</text><text x="20" y="480" font-size="13" fill="#527b95">Kattegatt</text><text x="265" y="485" font-size="13" fill="#527b95">Östersjön</text>${spots.map((p,i)=>`<g tabindex="0" role="button" aria-label="Välj punkt ${i+1}" onclick="tap(${i})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();tap(${i})}"><circle cx="${p.x}" cy="${p.y}" r="10" class="mapspot"/><text class="maplabel" x="${p.x+12}" y="${p.y-9}">${i+1}</text></g>`).join('')}<text x="10" y="558" font-size="10" fill="#547484">Schematisk övningskarta, inte exakt skalenlig</text></svg></div><div class="panel"><p class="tag">Plats ${mapStep+1} av ${spots.length}</p><h3>Hitta ${s.name}!</h3><p>Vilken av kartans numrerade punkter visar ${s.name}?</p><div class="row"><button onclick="mapHint()">💡 Ledtråd</button><button onclick="mapNext()">Hoppa över →</button></div>${feedback?`<div class="${feedback.startsWith('Rätt')?'feedback':'hint'}">${esc(feedback)}</div>`:''}<p>Hittade platser den här omgången: <b>${Object.keys(mapSolved).length}/${spots.length}</b></p>${Object.keys(mapSolved).length===spots.length?'<div class="feedback">🎉 Du hittade alla platser! Fantastiskt!</div>':''}<button class="primary" onclick="mapNext()">Nästa plats →</button></div></div>`}
function tap(i){if(i===mapStep){feedback='Rätt! Du hittade '+spots[i].name+'!';mapSolved[i]=true;data.map={completed:Object.keys(mapSolved).length,last:new Date().toLocaleDateString('sv-SE')};save()}else feedback='Inte riktigt. Titta på väderstrecken och prova en annan punkt. Ledtråden hjälper dig!';render()}function mapHint(){feedback='Ledtråd: '+spots[mapStep].hint;render()}function mapNext(){mapStep=(mapStep+1)%spots.length;feedback='';render()}
function repeat(){let wanted=topics.filter(t=>['again','doing'].includes(td(t.id).status));return `<h2>🔁 Repetera och bli säkrare</h2><div class="panel"><p>Öva på det du redan har gjort eller det du vill bli bättre på. Det är helt okej att prova igen!</p>${wanted.length?wanted.map(t=>`<div class="row" style="justify-content:space-between;border-bottom:1px solid #e4eced;padding:12px 0"><span>${t.emoji} ${t.name} ${badge(t.id)}</span><button onclick="start('${t.id}')">Repetera</button></div>`).join(''):'<p>Du har inga pågående områden än. Starta en lektion så dyker den upp här.</p>'}<h3>Alla teman</h3><div class="row">${topics.map(t=>`<button onclick="start('${t.id}')">${t.emoji} ${t.name}</button>`).join('')}</div></div>`}
function adult(){let n=s=>topics.filter(t=>td(t.id).status===s).length;return `<h2>👨‍🏫 Morfars översikt</h2><p>Här ser du vilka delar Aston har tränat på. Spara en säkerhetskopia om du vill kunna följa framsteg även vid byte av enhet.</p><div class="grid"><div class="panel"><div class="stats">${n('done')}</div>✅ Klara</div><div class="panel"><div class="stats">${n('doing')}</div>🟡 Pågår</div><div class="panel"><div class="stats">${n('again')}</div>🔁 Behöver tränas</div></div><section class="panel"><h3>Områden</h3>${topics.map(t=>`<div style="border-top:1px solid #edf1f2;padding:13px 0"><div class="row" style="justify-content:space-between"><b>${t.emoji} ${t.name}</b>${badge(t.id)}</div><p class="muted" style="margin:4px 0">Besök: ${td(t.id).visits} · Rätt totalt: ${td(t.id).correct} · Svarsförsök: ${td(t.id).attempts}${td(t.id).last?' · Senast: '+td(t.id).last:''}</p><div class="row"><button class="small" onclick="mark('${t.id}','done')">Markera klar</button><button class="small" onclick="mark('${t.id}','doing')">Pågår</button><button class="small" onclick="mark('${t.id}','again')">Behöver träning</button></div></div>`).join('')}</section><section class="panel"><h3>💾 Spara och flytta framsteg</h3><p>Uppgifter sparas automatiskt på denna enhet. Du kan även ladda ner en kopia och läsa in den igen på en annan enhet.</p><div class="row"><button class="primary" onclick="exportData()">Ladda ner framsteg</button><label for="importdata" style="background:#dbeef2;padding:10px 15px;border-radius:12px;cursor:pointer">Läs in sparad fil</label><input id="importdata" style="max-width:180px" type="file" accept="application/json,.json" onchange="importData(event)"></div><p class="notice"><b>Integritet:</b> Inga uppgifter skickas till någon server. Lokal sparning gäller bara i samma webbläsare och kan försvinna om webbläsardata rensas. Kopian är viktig om du vill spara framsteg långsiktigt.</p></section>`}
function mark(id,s){settd(id,{status:s});render()}function exportData(){const blob=new Blob([JSON.stringify({version:1,exported:new Date().toISOString(),data},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='astons-geografi-framsteg.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importData(e){const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{let v=JSON.parse(reader.result);if(!v.data||!v.data.topics)throw Error();if(confirm('Vill du ersätta nuvarande framsteg med de sparade?')){data=v.data;save();render()}}catch(err){alert('Filen kunde inte läsas. Välj en framstegsfil från denna sida.')}};reader.readAsText(f)}function go(v){view=v;feedback='';render()}function render(){let out={home,learn,lesson,finished,map,repeat,adult}[view]();$('#content').innerHTML=out;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));}document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.view)));render();
</script></body></html>
