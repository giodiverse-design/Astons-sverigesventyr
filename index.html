</style></head><body><header><h1>🧭 Astons Sverigeäventyr</h1><p>Upptäck Sverige, ett litet steg i taget! För årskurs 5.</p><nav><button class="nav active" data-view="home">🏠 Start</button><button class="nav" data-view="learn">📚 Lektioner</button><button class="nav" data-view="map">🗺️ Kartverkstad</button><button class="nav" data-view="repeat">🔁 Repetition</button><button class="nav" data-view="adult">👨‍🏫 Morfars översikt</button></nav></header><main><div id="content"></div></main><footer>Allt träningsarbete sparas lokalt i den här webbläsaren. Ingen inloggning krävs.</footer><script>

const key='aston-sverigetraning-v1';let data;try{data=JSON.parse(localStorage.getItem(key))||{}}catch(e){data={}};if(!data.topics)data.topics={};let view='home',activeTopic=topics[0].id,qi=0,chosen=null,tries=0,hintShown=false,mapStep=0,mapSolved={},feedback='';const $=s=>document.querySelector(s),save=()=>{try{localStorage.setItem(key,JSON.stringify(data))}catch(e){console.warn('Lokal lagring är inte tillgänglig i denna visning.')}};function td(id){return data.topics[id]||{status:'new',attempts:0,correct:0,visits:0}}function settd(id,values){data.topics[id]={...td(id),...values};save()}function status(id){let s=td(id).status;return s==='done'?'✅ Klar':s==='doing'?'🟡 Pågår':s==='again'?'🔁 Behöver träna':'⚪ Inte börjat'}function badge(id){return '<span class="tag '+td(id).status+'">'+status(id)+'</span>'}function progress(){return Math.round(100*topics.filter(t=>td(t.id).status==='done').length/topics.length)}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function home(){return `<div class="hero"><h2>Hej Aston! 👋</h2><p>Här får du upptäcka Sveriges landskap, städer, sjöar, älvar, berg, klimat och natur. Du behöver inte kunna allt direkt – det viktiga är att fundera och försöka.</p><div class="row"><button class="primary" onclick="go('learn')">Välj dagens lektion</button><button onclick="go('map')">Öppna kartverkstaden</button></div></div><section class="panel"><h2>Din upptäcktsresa</h2><div class="bar" aria-label="${progress()} procent klart"><div class="fill" style="width:${progress()}%"></div></div><p><b>${topics.filter(t=>td(t.id).status==='done').length} av ${topics.length}</b> områden klara • ${progress()} %</p><p class="muted">Tips: Träna gärna 10–15 minuter åt gången. Små steg räcker långt!</p></section><section><h2>Vad vill du utforska?</h2><div class="grid">${topics.map(t=>`<div class="topic"><h3>${t.emoji} ${t.name}</h3>${badge(t.id)}<p>${t.intro}</p><button onclick="start('${t.id}')">Öppna lektion</button></div>`).join('')}</div></section>`}
function learn(){return `<h2>📚 Välj din lektion</h2><p>Varje tema har tre korta fakta, två frågor och ledtrådar.</p><div class="grid">${topics.map(t=>`<div class="topic"><h3>${t.emoji} ${t.name}</h3>${badge(t.id)}<p>${t.intro}</p><button class="primary" onclick="start('${t.id}')">Träna här</button></div>`).join('')}</div>`}
function lesson(){const t=topics.find(t=>t.id===activeTopic),q=t.questions[qi];return `<button onclick="go('learn')">← Alla lektioner</button><section class="panel"><h2>${t.emoji} ${t.name}</h2>${badge(t.id)}<p>${t.intro}</p><h3>Tre saker att upptäcka</h3><ol>${t.facts.map(f=>`<li>${f}</li>`).join('')}</ol><hr><p class="muted">Fråga ${qi+1} av ${t.questions.length}</p><div class="question"><h3>${esc(q[0])}</h3><div class="options">${q[1].map((o,i)=>`<button class="${chosen===i?'chosen':''}" onclick="choose(${i})" ${feedback.startsWith('Rätt')?'disabled':''}>${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}</div><div class="row"><button onclick="showHint()">💡 Ge mig en ledtråd</button><button class="primary" onclick="check()">Kontrollera mitt svar</button></div>${hintShown?`<div class="hint">${esc(q[3])}</div>`:''}${feedback?`<div class="${feedback.startsWith('Rätt')?'feedback':'hint'}">${esc(feedback)}</div>`:''}${feedback.startsWith('Rätt')?`<button class="primary" onclick="nextQuestion()">${qi===t.questions.length-1?'Avsluta lektion':'Nästa fråga →'}</button>`:''}</div></section>`}
function start(id){activeTopic=id;qi=0;chosen=null;tries=0;hintShown=false;feedback='';settd(id,{status:td(id).status==='done'?'done':'doing',visits:td(id).visits+1});view='lesson';render()}function choose(i){chosen=i;feedback='';render()}function showHint(){hintShown=true;render()}function check(){const t=topics.find(t=>t.id===activeTopic);if(chosen===null){feedback='Välj ett alternativ först. Du kan också be om en ledtråd.';render();return}let right=chosen===t.questions[qi][2];tries++;settd(activeTopic,{attempts:td(activeTopic).attempts+1,correct:td(activeTopic).correct+(right?1:0)});feedback=right?'Rätt! Bra tänkt. Kan du förklara varför svaret stämmer?':'Inte riktigt än. Läs ledtråden och försök igen. Du lär dig när du provar!';if(!right)hintShown=true;render()}function nextQuestion(){let t=topics.find(t=>t.id===activeTopic);if(qi<t.questions.length-1){qi++;chosen=null;tries=0;hintShown=false;feedback='';render();return}settd(activeTopic,{status:td(activeTopic).correct>=t.questions.length&&td(activeTopic).attempts<=t.questions.length*2?'done':'again',last:new Date().toLocaleDateString('sv-SE')});view='finished';render()}
function finished(){return `<div class="hero"><h2>🌟 Bra jobbat, Aston!</h2><p>Du har tränat på ${topics.find(t=>t.id===activeTopic).name.toLowerCase()}.</p>${badge(activeTopic)}<p>Vill du göra om lektionen, prova en karta eller ta en liten paus?</p><div class="row"><button onclick="start('${activeTopic}')">Träna igen</button><button class="primary" onclick="go('map')">Kartverkstad</button><button onclick="go('home')">Till start</button></div></div>`}

function mapSaved(id){if(!data.mapLevels)data.mapLevels={};if(!data.mapLevels[id])data.mapLevels[id]={found:[],attempts:0,correct:0};return data.mapLevels[id]}
function shuffleMap(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function mapNewQuestion(){let level=mapLevels.find(x=>x.id===mapLevel),seen=mapRoundSeen[mapLevel]||[];if(seen.length>=level.places.length)seen=[];let remaining=level.places.map((_,i)=>i).filter(i=>!seen.includes(i));let target=remaining[Math.floor(Math.random()*remaining.length)];mapRoundSeen[mapLevel]=[...seen,target];let pool=shuffleMap(level.places.map((_,i)=>i).filter(i=>i!==target));let picks=[target];for(let i of pool){let far=picks.every(j=>Math.hypot(level.places[i][1]-level.places[j][1],level.places[i][2]-level.places[j][2])>43);if(far)picks.push(i);if(picks.length===4)break}for(let i of pool){if(picks.length===4)break;if(!picks.includes(i))picks.push(i)}mapQuestion={target,picks:shuffleMap(picks),answered:false};mapMessage='';mapHintShown=false;mapWrong=null}
function selectMapLevel(id){mapLevel=id;mapNewQuestion();render()}
function mapPick(i){if(!mapQuestion||mapQuestion.answered)return;let level=mapLevels.find(x=>x.id===mapLevel),saved=mapSaved(mapLevel),target=mapQuestion.target;saved.attempts++;if(i===target){mapQuestion.answered=true;saved.correct++;let name=level.places[target][0];if(!saved.found.includes(name))saved.found.push(name);mapMessage='Rätt! '+level.places[target][4];data.map={completed:saved.found.length,last:new Date().toLocaleDateString('sv-SE')};mapWrong=null}else{mapMessage='Inte riktigt. Försök igen! Titta var punkterna ligger och använd gärna ledtråden.';mapHintShown=true;mapWrong=i}save();render()}
function mapHint(){mapHintShown=true;render()}
function mapNext(){mapNewQuestion();render()}
function map(){if(!mapQuestion)mapNewQuestion();let level=mapLevels.find(x=>x.id===mapLevel),q=mapQuestion,p=level.places[q.target],saved=mapSaved(mapLevel);return `<h2>🗺️ Kartverkstad – nivå 1, 2 och 3</h2><p>Välj ett tema. Läs frågan och tryck på den gula punkten på kartan. Du får ledtrådar om du behöver.</p><div class="level-tabs" role="group" aria-label="Välj kartövning">${mapLevels.map((l,i)=>`<button class="${l.id===mapLevel?'selected':''}" aria-pressed="${l.id===mapLevel}" onclick="selectMapLevel('${l.id}')">${i+1}. ${l.emoji} ${l.name}</button>`).join('')}</div><div class="map-grid"><div class="panel map-panel"><svg class="landscape" viewBox="0 0 350 570" role="group" aria-label="Schematisk karta över Sverige med fyra valbara punkter"><rect width="350" height="570" fill="#e7f3f8"/><path d="M164 15 L183 27 205 51 199 76 218 107 208 134 222 164 210 201 235 226 224 267 240 305 258 331 252 365 264 401 254 429 235 451 227 473 211 493 199 514 188 529 173 539 153 531 132 512 139 482 122 458 125 428 110 405 123 381 118 352 106 320 117 295 122 264 121 229 126 199 133 171 129 145 140 122 130 96 147 73 138 43 Z" fill="#b1d4ad" stroke="#4d8d6e" stroke-width="2"/><path d="M230 486 Q237 490 238 506 L234 523 230 516 Z" fill="#b1d4ad" stroke="#4d8d6e" stroke-width="1.5"/><path d="M272 445 Q283 452 281 476 L274 489 268 477 269 458Z" fill="#b1d4ad" stroke="#4d8d6e" stroke-width="1.5"/><path d="M160 416 Q174 406 189 415 L190 437 174 444 160 432Z" class="mapwater"/><path d="M201 429 Q204 435 199 456 L195 467 191 451Z" class="mapwater"/><text x="20" y="55" font-size="15" fill="#527b95">NORGE</text><text x="255" y="170" font-size="14" fill="#527b95">FINLAND</text><text x="20" y="481" font-size="13" fill="#527b95">Kattegatt</text><text x="265" y="522" font-size="13" fill="#527b95">Östersjön</text>${q.picks.map((idx,i)=>{let loc=level.places[idx],correct=q.answered&&idx===q.target,wrong=mapWrong===idx;return `<g tabindex="0" role="button" aria-label="Välj punkt ${i+1}" onclick="mapPick(${idx})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();mapPick(${idx})}"><circle class="map-pick ${correct?'correct':wrong?'wrong':''}" cx="${loc[1]}" cy="${loc[2]}" r="15"/><text class="map-number" x="${loc[1]}" y="${loc[2]+1}">${i+1}</text></g>${correct?`<text class="map-answer" x="${Math.min(loc[1]+18,250)}" y="${loc[2]-17}">${esc(loc[0])}</text>`:''}`}).join('')}<text x="12" y="558" font-size="10" fill="#547484">Förenklad övningskarta – inte skalenlig</text></svg><p class="map-footnote">Kartan visar ungefärliga lägen. För sjöar, älvar och stora landskap markerar punkten en representativ plats.</p></div><div class="panel map-panel"><span class="tag">${level.emoji} ${level.name}</span><h3>Var ligger ${esc(p[0])}?</h3><p>${esc(level.description)}</p><p>Tryck på rätt punkt (1–4) på kartan, eller välj ett nummer här:</p><div class="map-actions">${q.picks.map((idx,i)=>`<button ${q.answered?'disabled':''} onclick="mapPick(${idx})">${i+1}</button>`).join('')}</div><div class="row" style="margin-top:12px"><button onclick="mapHint()">💡 Ledtråd</button><button onclick="mapNext()">Hoppa över →</button></div>${mapHintShown?`<div class="hint">${esc(p[3])}</div>`:''}${mapMessage?`<div class="${q.answered?'feedback':'hint'}" aria-live="polite">${esc(mapMessage)}</div>`:''}${q.answered?`<button class="primary" onclick="mapNext()">Nästa plats →</button>`:''}<div class="map-score"><b>Din utveckling – ${esc(level.name)}</b><p>${saved.found.length} av ${level.places.length} platser hittade minst en gång</p><div class="bar" aria-label="${Math.round(saved.found.length/level.places.length*100)} procent"><div class="fill" style="width:${Math.round(saved.found.length/level.places.length*100)}%"></div></div><p class="muted">Rätta svar totalt: ${saved.correct} · Försök: ${saved.attempts}</p></div><p class="muted">Tips: Fundera först på om platsen ligger i norr, söder, öster eller väster.</p></div></div>`}

function repeat(){let wanted=topics.filter(t=>['again','doing'].includes(td(t.id).status));return `<h2>🔁 Repetera och bli säkrare</h2><div class="panel"><p>Öva på det du redan har gjort eller det du vill bli bättre på. Det är helt okej att prova igen!</p>${wanted.length?wanted.map(t=>`<div class="row" style="justify-content:space-between;border-bottom:1px solid #e4eced;padding:12px 0"><span>${t.emoji} ${t.name} ${badge(t.id)}</span><button onclick="start('${t.id}')">Repetera</button></div>`).join(''):'<p>Du har inga pågående områden än. Starta en lektion så dyker den upp här.</p>'}<h3>Alla teman</h3><div class="row">${topics.map(t=>`<button onclick="start('${t.id}')">${t.emoji} ${t.name}</button>`).join('')}</div></div>`}
function adult(){let n=s=>topics.filter(t=>td(t.id).status===s).length;return `<h2>👨‍🏫 Morfars översikt</h2><p>Här ser du vilka delar Aston har tränat på. Spara en säkerhetskopia om du vill kunna följa framsteg även vid byte av enhet.</p><div class="grid"><div class="panel"><div class="stats">${n('done')}</div>✅ Klara</div><div class="panel"><div class="stats">${n('doing')}</div>🟡 Pågår</div><div class="panel"><div class="stats">${n('again')}</div>🔁 Behöver tränas</div></div><section class="panel"><h3>Områden</h3>${topics.map(t=>`<div style="border-top:1px solid #edf1f2;padding:13px 0"><div class="row" style="justify-content:space-between"><b>${t.emoji} ${t.name}</b>${badge(t.id)}</div><p class="muted" style="margin:4px 0">Besök: ${td(t.id).visits} · Rätt totalt: ${td(t.id).correct} · Svarsförsök: ${td(t.id).attempts}${td(t.id).last?' · Senast: '+td(t.id).last:''}</p><div class="row"><button class="small" onclick="mark('${t.id}','done')">Markera klar</button><button class="small" onclick="mark('${t.id}','doing')">Pågår</button><button class="small" onclick="mark('${t.id}','again')">Behöver träning</button></div></div>`).join('')}</section><section class="panel"><h3>🗺️ Kartverkstad – framsteg</h3>${mapLevels.map(l=>{let m=mapSaved(l.id);return `<p><b>${l.emoji} ${l.name}:</b> ${m.found.length} av ${l.places.length} platser hittade · ${m.correct} rätta svar · ${m.attempts} försök</p>`}).join('')}</section><section class="panel"><h3>💾 Spara och flytta framsteg</h3><p>Uppgifter sparas automatiskt på denna enhet. Du kan även ladda ner en kopia och läsa in den igen på en annan enhet.</p><div class="row"><button class="primary" onclick="exportData()">Ladda ner framsteg</button><label for="importdata" style="background:#dbeef2;padding:10px 15px;border-radius:12px;cursor:pointer">Läs in sparad fil</label><input id="importdata" style="max-width:180px" type="file" accept="application/json,.json" onchange="importData(event)"></div><p class="notice"><b>Integritet:</b> Inga uppgifter skickas till någon server. Lokal sparning gäller bara i samma webbläsare och kan försvinna om webbläsardata rensas. Kopian är viktig om du vill spara framsteg långsiktigt.</p></section>`}
function mark(id,s){settd(id,{status:s});render()}function exportData(){const blob=new Blob([JSON.stringify({version:1,exported:new Date().toISOString(),data},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='astons-geografi-framsteg.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importData(e){const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{let v=JSON.parse(reader.result);if(!v.data||!v.data.topics)throw Error();if(confirm('Vill du ersätta nuvarande framsteg med de sparade?')){data=v.data;save();render()}}catch(err){alert('Filen kunde inte läsas. Välj en framstegsfil från denna sida.')}};reader.readAsText(f)}function go(v){view=v;feedback='';render()}function render(){let out={home,learn,lesson,finished,map,repeat,adult}[view]();$('#content').innerHTML=out;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));}document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.view)));render();
</script></body></html>
